name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockly
          POSTGRES_PASSWORD: stockly
          POSTGRES_DB: stockly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=stockly;Username=stockly;Password=stockly"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Stockly.sln

      - name: Build
        run: dotnet build Stockly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Stockly.sln --no-build --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Check for model changes missing a migration
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Stockly.Infrastructure
          --startup-project src/Stockly.API

      - name: Apply migrations against a real database
        run: >-
          dotnet ef database update
          --project src/Stockly.Infrastructure
          --startup-project src/Stockly.API

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Stockly.Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint
